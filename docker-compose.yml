services:
  se-notebook:
    build: .
    container_name: se-notebook
    ports:
      # bind to localhost only — not reachable from the network
      - "127.0.0.1:3001:3001"
    volumes:
      # persists your SQLite file and uploads on the host
      - ./server/db:/app/server/db
      - ./server/uploads:/app/server/uploads
    env_file:
      - .env
    restart: always

  chromadb:
    # Pinned: :latest silently drifts and has moved the persist path before,
    # which orphaned the volume and wiped ingested data. Pin to the known-good version.
    image: chromadb/chroma:1.0.0
    ports:
      # localhost only — ChromaDB has no auth; only the app/ingest need it
      - "127.0.0.1:8000:8000"
    volumes:
      # Chroma 1.x persists to /data — the volume MUST mount there (was /chroma/chroma,
      # an older path, so nothing was actually persisted).
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

volumes:
  chroma_data:
